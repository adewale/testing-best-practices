name: Ruff

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uvx ruff@0.16.0 check evals/oracles research/diagrams scripts skill-development/scripts
      - name: Build isolated behavioral fixture runner
        working-directory: skill-development/evals
        run: docker build -f Dockerfile.behavioral-oracles -t tbp-behavioral-oracles:local .
      - name: Verify executed grading and candidate isolation
        run: uv run --no-project --with-requirements skill-development/evals/requirements.txt python skill-development/scripts/test-behavioral-oracles.py
