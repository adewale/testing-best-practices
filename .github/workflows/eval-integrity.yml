name: Eval integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-gates:
    runs-on: ubuntu-latest
    env:
      GOCACHE: /tmp/testing-best-practices-go-cache
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Run deterministic eval gates
        run: python3 skill-development/scripts/check-all.py
