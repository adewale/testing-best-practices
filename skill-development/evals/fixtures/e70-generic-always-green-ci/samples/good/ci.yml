name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[test]'
      - name: Unit tests (coverage enforced by fail_under in pyproject)
        run: pytest -q --cov=src --cov-branch --cov-report=term-missing
      - name: Secrets scan (fails on any secret not already in the baseline)
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e '.[test]'
      - run: pytest -q tests/e2e
